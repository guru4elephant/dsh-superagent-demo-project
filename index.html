<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Board</title>
  <meta name="description" content="A tiny task board demo for the dsh-superagent multi-developer workflow.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%233e7db2'/%3E%3C/svg%3E">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Task Board">
  <meta property="og:description" content="A tiny task board demo for the dsh-superagent multi-developer workflow.">
  <meta property="og:url" content="https://guru4elephant.github.io/dsh-superagent-demo-project/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Task Board">
  <meta name="twitter:description" content="A tiny task board demo for the dsh-superagent multi-developer workflow.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Task Board</h1>
    <p class="tagline">Keep track of what needs doing.</p>
  </header>
  <main>
    <section class="panel">
      <h2>Today</h2>
      <ul id="list" class="task-list"></ul>
      <form id="add-form">
        <input id="task-input" type="text" placeholder="Add a task…" />
        <button type="submit">Add</button>
      </form>
      <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
