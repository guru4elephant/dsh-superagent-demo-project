<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Task Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Task Board</h1>
    <p class="tagline">Keep track of what need doing.</p>
  </header>
  <main>
    <section class="panel">
      <h2>Today</h2>
      <ul id="list" class="task-list"></ul>
      <form id="add-form">
        <input id="task-input" type="text" placeholder="Add a task…" />
        <button type="submit">Add</button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
