name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          set -e
          for f in index.html styles.css app.js README.md; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required file is missing"
              exit 1
            fi
            echo "ok: $f"
          done

      - name: Validate HTML structure
        run: |
          set -e
          python3 - <<'PY'
          import sys, re
          from html.parser import HTMLParser

          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack, self.errors = [], []
                  self.void = {'area','base','br','col','embed','hr','img','input',
                               'link','meta','param','source','track','wbr'}
              def handle_starttag(self, tag, attrs):
                  if tag not in self.void:
                      self.stack.append(tag)
              def handle_endtag(self, tag):
                  if tag in self.void:
                      return
                  if not self.stack:
                      self.errors.append(f'stray </{tag}>')
                  elif self.stack[-1] != tag:
                      self.errors.append(f'</{tag}> closes <{self.stack[-1]}>')
                      self.stack.pop()
                  else:
                      self.stack.pop()

          src = open('index.html', encoding='utf-8').read()
          c = Check(); c.feed(src)
          if c.stack:
              c.errors.append('unclosed: ' + ', '.join(c.stack))
          # referenced local assets must exist
          import os
          for m in re.findall(r'(?:href|src)="([^"#:]+)"', src):
              if not os.path.exists(m):
                  c.errors.append(f'missing asset: {m}')
          if c.errors:
              for e in c.errors:
                  print(f'::error file=index.html::{e}')
              sys.exit(1)
          print('index.html structure ok')
          PY

      - name: Validate JavaScript syntax
        run: node --check app.js && echo "app.js syntax ok"

      - name: Check CSS braces balance
        run: |
          python3 - <<'PY'
          import sys
          css = open('styles.css', encoding='utf-8').read()
          if css.count('{') != css.count('}'):
              print(f"::error file=styles.css::Unbalanced braces: "
                    f"{css.count('{')} open vs {css.count('}')} close")
              sys.exit(1)
          print('styles.css braces balanced')
          PY

      - name: Spell-check common typos
        run: |
          set +e
          PATTERN='excercise|requried|recieve|seperate|occured|teh |adn |definately'
          HITS=$(grep -rnEi "$PATTERN" --include='*.md' --include='*.html' --include='*.js' --include='*.css' . || true)
          if [ -n "$HITS" ]; then
            echo "$HITS" | while IFS= read -r line; do
              echo "::error::Typo found: $line"
            done
            exit 1
          fi
          echo "no known typos"
